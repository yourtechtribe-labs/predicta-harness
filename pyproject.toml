[project]
name = "predicta-harness"
version = "0.1.0"
description = "A provider-agnostic agent harness for Python — the Claude Code / Flue pattern, but in Python and not tied to a single model provider."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albert Gil López" }]
keywords = ["agent", "llm", "harness", "tool-use", "anthropic", "openai"]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Ceiling, not just a floor. The Anthropic SDK released 1.0.0 and REMOVED
# `temperature` from `messages.create` — its parameters are now max_tokens,
# messages, model, cache_control, container, inference_geo, metadata,
# output_config, service_tier, stop_sequences, stream, system, thinking,
# tool_choice, tools, user_profile_id.
#
# `>=0.40` let that into a production image with no warning, and the failure
# surfaced nowhere except in production: the reconciliation triage died on its
# first call with `Messages.create() got an unexpected keyword argument
# 'temperature'`, having judged 0 of 1.798 matches (2026-08-21). Locally the
# same code works, because this machine has 0.122.0.
#
# The cap buys the time to port to 1.0 deliberately rather than discovering it
# from a client-facing job. Sampling settings appear to have moved under
# `output_config`; that port is its own change, with its own measurement.
anthropic = ["anthropic>=0.40,<1.0"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.40,<1.0", "openai>=1.40"]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predicta_harness"]

[tool.pytest.ini_options]
# `ratchet.py` and `state.py` live at the repository root rather than inside the
# package: they govern this repo, they are not part of what it ships, and a consumer
# installing `predicta_harness` has no business importing either.
#
# That placement made the suite pass or fail depending on HOW it was invoked, which is
# the worst kind of green. `python -m pytest` puts the working directory on sys.path and
# plain `pytest` does not, so `ratchet.py --check` -- which spawns the former -- was
# passing while `pytest -q` could not even import tests/test_namespaces.py. Found on
# 2026-08-24 by the `compat` CI job on its first run, reported as a 3.10 and 3.12
# failure; it reproduces identically on 3.11, so the interpreter was never the cause.
pythonpath = ["."]
